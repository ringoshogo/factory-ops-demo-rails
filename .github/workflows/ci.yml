name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      # 依存の向きと公開 API の限定を強制する（adr/002）
      - name: Check package boundaries
        run: bin/packwerk validate && bin/packwerk check

      # 残件と改善の候補の台帳の形と、ID の参照を確かめる（docs/guides/dev-cycle.md「機械で守ること」）
      - name: Check ledgers
        run: bin/check-open-items

      # PR の本文に書いた OI-NN・IB-NN も台帳にあること。本文は式に直接埋め込まず、環境変数で渡す
      - name: Check ledger references in the PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | bin/check-open-items --text -

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test

    steps:
      # structure.sql を書く pg_dump をサーバーと同じ 18 系に揃える（adr/001 決定 6）
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # 所有ロールとアプリのロールを作る。サービスのコンテナには初期化スクリプトを渡せないので、psql で流す
      - name: Create database roles
        run: psql -h localhost -p 5433 -U postgres -v ON_ERROR_STOP=1 -f docker/initdb/01_roles.sql
        env:
          PGPASSWORD: postgres

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bundle exec rspec --format progress --format json --out tmp/rspec.json

      # 層ごとの件数・割合・時間をジョブの要約に書き、未分類のファイルがあれば落とす（docs/guides/testing.md「テストの層」）
      - name: Report test layers
        run: bin/test-layers tmp/rspec.json

      # マイグレーションの結果と、読み込み直して書き出した結果の両方が structure.sql と一致すること
      - name: Check structure.sql round-trip
        run: bin/check-structure
