name: CI

on:
  pull_request:
  push:
    branches: [ main, m42-ci-publish ]

# 権限を書かないジョブの権限はリポジトリの設定で決まるので、最上位を読み取りだけにし、
# GHCR へ書く packages: write は publish のジョブにだけ書く
permissions:
  contents: read

# amd64 のジョブは ubuntu-24.04、arm64 のジョブは ubuntu-24.04-arm に固定する。ubuntu-latest は GitHub が日程で
# OS の版を上げ、CI が通るかを確かめないまま版が変わる。版を上げる時期は docs/guides/config.md「CI の工程」にある
jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      # 台帳と証跡の SHA が HEAD の祖先かを確かめ、スキーマの互換の基準を取るので、履歴をすべて取る
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      # 依存の向きと公開 API の限定を強制する（adr/002）
      - name: Check package boundaries
        run: bin/packwerk validate && bin/packwerk check

      # 残件と改善の候補の台帳の形と、ID の参照を確かめる（docs/guides/dev-cycle.md「機械で守ること」）
      - name: Check ledgers
        run: bin/check-open-items

      # 台帳・証跡・引き継ぎに書いた commit の SHA が HEAD の祖先であること（docs/guides/dev-cycle.md「機械で守ること」）
      - name: Check commit references
        run: bin/check-commit-refs

      # GraphQL のスキーマの非推奨を経ない破壊的変更を落とす（docs/architecture/graphql-schema.md「互換の判定」）。
      # main への push では push の前の先端（github.event.before）と比べる。origin/main と比べると、分岐点が HEAD 自身になり何も比べないからである。
      - name: Check GraphQL schema compatibility
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bin/check-schema-compat

      # 警報の規則の式と、テストの系列での発火と不発火を、Prometheus のイメージの promtool で確かめる（docs/slo.md）
      - name: Check alert rules
        run: bin/check-alerts

      # PR の本文に書いた OI-NN・IB-NN も台帳にあること。本文は式に直接埋め込まず、環境変数で渡す
      - name: Check ledger references in the PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | bin/check-open-items --text -

  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test

    steps:
      # structure.sql を書く pg_dump をサーバーと同じ 18 系に揃える（adr/001 決定 6）
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      # 分岐の網羅率の警告が、基準の ref との分岐点からの差分を取るので、履歴をすべて取る
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # 所有ロールとアプリのロールを作る。サービスのコンテナには初期化スクリプトを渡せないので、psql で流す
      - name: Create database roles
        run: psql -h localhost -p 5433 -U postgres -v ON_ERROR_STOP=1 -f docker/initdb/01_roles.sql
        env:
          PGPASSWORD: postgres

      - name: Prepare database
        run: bin/rails db:test:prepare

      # 分岐の通過を測りながら流す（docs/guides/testing.md「分岐の網羅率の警告」）。計測のために全件をもう 1 回流さない
      - name: Run tests
        env:
          COVERAGE: "1"
        run: bundle exec rspec --format progress --format json --out tmp/rspec.json

      # PR が足した行のうち、どの example も通らない分岐を警告の注釈とジョブの要約に出す。失敗にはしない。
      # 基準は lint のジョブの互換の検査と同じ式で決める。origin/main のままだと、main への push では差分が空になり、
      # 積み重ねた PR では main からの累積の差分になるからである
      - name: Report uncovered branches
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bin/check-branch-coverage

      # 層ごとの件数・割合・時間をジョブの要約に書き、未分類のファイルがあれば落とす（docs/guides/testing.md「テストの層」）
      - name: Report test layers
        run: bin/test-layers tmp/rspec.json

      # マイグレーションの結果と、読み込み直して書き出した結果の両方が structure.sql と一致すること
      - name: Check structure.sql round-trip
        run: bin/check-structure

  # 画面（frontend/）の検査。codegen の生成物が schema.graphql と画面の問い合わせから作り直したものと一致し、
  # 型検査・lint（コメントの検査を含む）・単体テストが通ることを確かめる
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Node は 22 系にする。frontend/package.json の engines（22.12 以上）を満たす
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated GraphQL types
        run: npm run codegen:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  # 画面を Rails・bin/jobs・Next に当てて流す E2E。Playwright の webServer が E2E の DB を作り直し、世界を作ってから
  # 起こす（frontend/e2e/start-rails.sh）。DB とロールの準備は test のジョブと同じ
  e2e:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      CI: "1"

    steps:
      # db:prepare が structure.sql を psql で読み込むので、サーバーと同じ 18 系の client を入れる（adr/001 決定 6）
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Create database roles
        run: psql -h localhost -p 5433 -U postgres -v ON_ERROR_STOP=1 -f docker/initdb/01_roles.sql
        env:
          PGPASSWORD: postgres

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      # 落ちたときに、各テストのトレースと画面を残す
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  # PR がイメージに入るもの（Dockerfile・依存・本番の設定・マニフェスト・このワークフロー）を変えたかを決める。
  # それ以外の PR では images のジョブを流さない。images はイメージに入るものだけを確かめ、依存が変わって
  # GitHub Actions のキャッシュが外れると数分延びるからである（docs/guides/config.md「CI の工程」）。アプリのコードを本番の環境で読み込めることは、test のジョブが eager_load で確かめる
  image_inputs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whether image inputs changed
        id: diff
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          pattern='^(Dockerfile|\.dockerignore|Gemfile|Gemfile\.lock|\.ruby-version|vendor/|bin/(docker-entrypoint|thrust|rails|jobs)$|config/(application|boot|environment|puma|database|queue|recurring)\.(rb|yml)$|config/environments/production\.rb$|config/initializers/|deploy/|frontend/(Dockerfile|Dockerfile\.dockerignore|package\.json|package-lock\.json|next\.config\.mjs|security-headers\.json)$|db/seeds/demo_accounts\.json$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "$(git merge-base "$BASE_REF" HEAD)" HEAD | grep -qE "$pattern"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # 公開の配置のマニフェストを照らす。kubectl が入った amd64 のランナーで流し、arm64 のランナーのイメージに頼らない。
  # 1 分で終わるので、image_inputs で絞らずに PR と main への push の両方で流す
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Kustomize の置き換えを描き、Kubernetes の型と照らす。kubeconform は取ったファイルを、リリースの sha256 と比べてから展開する
      - name: Validate manifests
        run: |
          kubectl kustomize deploy > "$RUNNER_TEMP/rendered.yaml"
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary "$RUNNER_TEMP/rendered.yaml"

  # 公開の配置の 2 つのイメージを、arm64 のランナーで linux/arm64 のまま組み立てて確かめる（docs/adr/009 決定 6、deploy/README.md）。
  # GHCR には置かない（publish のジョブが置く）。main への push では毎回流すので、PR で流さなかった変更も main で確かめる
  images:
    needs: image_inputs
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.image_inputs.outputs.changed == 'true') }}
    runs-on: ubuntu-24.04-arm
    env:
      API_IMAGE: ghcr.io/ringoshogo/factory-ops-demo-rails/api:${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/ringoshogo/factory-ops-demo-rails/frontend:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # GitHub Actions のキャッシュ（type=gha）に書くには buildx が要る
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          tags: ${{ env.API_IMAGE }}
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # 本番の環境（eager_load）で全コードを読み込めることを、arm64 のイメージのまま確かめる。DB には繋がない
      - name: Boot API image in production
        run: |
          docker run --rm --platform linux/arm64 -e SECRET_KEY_BASE_DUMMY=1 "$API_IMAGE" \
            bin/rails runner 'abort "eager_load が偽" unless Rails.application.config.eager_load; puts "eager_load: ok"'

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          tags: ${{ env.FRONTEND_IMAGE }}
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # main への push で、ほかのすべてのジョブが成功したときだけ、2 つのイメージを git の SHA のタグで GHCR に置く。
  # latest のタグは付けない。images と同じキャッシュの scope から組み立て直すので、組み立ては数十秒で終わる。
  # ジョブの if: は、ジョブの名前を並べずに needs.*.result で決める。名前を並べると、needs に足したジョブを
  # if: に足し忘れたときに、そのジョブが落ちても push する。!cancelled() を書くのは、状態の関数が無いと GitHub が
  # 暗黙の success() を足し、push では skip される image_inputs から依存の連なりで publish も skip されるからである。
  # needs.*.result に skipped が無いことはジョブの段の条件にせず、最初のステップで確かめる。ジョブの段の if: では、
  # needs の先で skip された image_inputs が skipped として見え、push のたびに publish が skip される。ステップの段では
  # 直接の needs だけが見えるので、needs のジョブが skip されたときは、組み立てる前に publish を落とす。
  # ログインと push のステップの if: は、main 以外のブランチへの push で publish が走っても GHCR に何も置かないためで、
  # ワークフローの契機を一時に広げて publish の条件を確かめるときにも、この if: でステップが skip される
  publish:
    needs: [ scan_ruby, lint, test, frontend, e2e, manifests, images ]
    if: ${{ github.event_name == 'push' && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/ringoshogo/factory-ops-demo-rails/api:${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/ringoshogo/factory-ops-demo-rails/frontend:${{ github.sha }}
    steps:
      - name: Fail if a needed job was skipped
        if: contains(needs.*.result, 'skipped')
        run: |
          echo "::error::publish の needs のジョブが skip された。確かめていない commit のイメージを置かないので落とす"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          tags: ${{ env.API_IMAGE }}
          load: true
          cache-from: type=gha,scope=api

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          tags: ${{ env.FRONTEND_IMAGE }}
          load: true
          cache-from: type=gha,scope=frontend

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$API_IMAGE"
          docker push "$FRONTEND_IMAGE"
