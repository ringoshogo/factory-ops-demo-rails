query SupplierShipmentRequests($first: Int, $after: String, $orderBy: ShipmentRequestOrder, $filter: ShipmentRequestFilter) {
  supplier {
    shipmentRequests(first: $first, after: $after, orderBy: $orderBy, filter: $filter) {
      totalCount
      nodes {
        id
        dueDate
        status
        salesOrder { id orderNo }
        customer { id name }
        lines { id quantity }
        instruction { id plannedDate }
      }
      pageInfo { hasNextPage endCursor }
    }
  }
}
