query SupplierStocks($first: Int, $after: String, $orderBy: StockOrder, $thenBy: [StockOrder!], $filter: StockFilter) {
  supplier {
    stocks(first: $first, after: $after, orderBy: $orderBy, thenBy: $thenBy, filter: $filter) {
      totalCount
      nodes {
        onHand
        allocated
        available
        safetyStock
        belowSafetyStock
        item { id code name unit }
      }
      pageInfo { hasNextPage endCursor }
    }
  }
}
