query BuyerSupplierCatalog($supplierTenantId: ID!, $first: Int, $after: String) {
  buyer {
    supplier(supplierTenantId: $supplierTenantId) {
      supplier { id name }
      permissions
      catalog(first: $first, after: $after) {
        totalCount
        nodes { code name unit unitPrice taxRatePercent }
        pageInfo { hasNextPage endCursor }
      }
    }
  }
}
