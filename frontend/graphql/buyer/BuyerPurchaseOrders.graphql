query BuyerPurchaseOrders($first: Int, $after: String, $orderBy: PurchaseOrderOrder, $filter: PurchaseOrderFilter) {
  buyer {
    purchaseOrders(first: $first, after: $after, orderBy: $orderBy, filter: $filter) {
      totalCount
      nodes {
        id
        orderNo
        orderDate
        desiredDeliveryOn
        status
        supplier { id name }
        lines { id partNumber quantity confirmedItemName confirmedUnitPrice }
        inboundShipments { id shippedOn }
        supplierShipments { shippedOn }
      }
      pageInfo { hasNextPage endCursor }
    }
  }
}
