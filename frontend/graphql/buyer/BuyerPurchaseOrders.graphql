query BuyerPurchaseOrders(
  $first: Int
  $after: String
  $orderBy: PurchaseOrderOrder
  $filter: PurchaseOrderFilter
  $allFilter: PurchaseOrderFilter
  $openFilter: PurchaseOrderFilter
  $inboundFilter: PurchaseOrderFilter
  $inspectedFilter: PurchaseOrderFilter
  $cancelledFilter: PurchaseOrderFilter
) {
  supplier { dashboard { businessDate } }
  buyer {
    suppliers { supplier { id name } }
    purchaseOrders(first: $first, after: $after, orderBy: $orderBy, filter: $filter) {
      totalCount
      nodes {
        id
        orderNo
        orderDate
        desiredDeliveryOn
        status
        cancellationPending
        supplier { id name }
        lines { id partNumber quantity confirmedItemName confirmedUnitPrice }
        inboundShipments { id shippedOn }
        supplierShipments { shippedOn }
      }
      pageInfo { hasNextPage endCursor }
    }
    all: purchaseOrders(filter: $allFilter) { totalCount }
    open: purchaseOrders(filter: $openFilter) { totalCount }
    inbound: purchaseOrders(filter: $inboundFilter) { totalCount }
    inspected: purchaseOrders(filter: $inspectedFilter) { totalCount }
    cancelled: purchaseOrders(filter: $cancelledFilter) { totalCount }
  }
}
