query BuyerReceivedInvoice($id: ID!) {
  supplier { dashboard { businessDate } }
  buyer {
    receivedInvoice(id: $id) {
      id
      invoiceNumber
      issuedOn
      periodStart
      periodEnd
      subtotal
      taxTotal
      total
      supplier { id name }
      lines {
        itemName
        quantity
        unitPrice
        taxRatePercent
        amount
        purchaseOrderLine { id partNumber }
      }
    }
  }
}
