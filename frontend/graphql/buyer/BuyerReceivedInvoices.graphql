query BuyerReceivedInvoices($first: Int, $after: String) {
  supplier { dashboard { businessDate } }
  buyer {
    receivedInvoices(first: $first, after: $after) {
      totalCount
      nodes {
        id
        invoiceNumber
        issuedOn
        periodStart
        periodEnd
        total
        supplier { id name }
      }
      pageInfo { hasNextPage endCursor }
    }
  }
}
