services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 手元の PostgreSQL 16 が 5432 を使うため
      - "5433:5432"
    volumes:
      # 18 のイメージはデータを /var/lib/postgresql/18/docker に置く
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
