# メトリクスのラベル operation に使う GraphQL の操作名。operationName はクライアントが自由に付けるので、ここに無い名前と、
# 種類の違う操作に付いた名前は other にする。値の種類が増え続けると、メトリクスの保存が膨らむからである
# （docs/guides/config.md「メトリクス」）。
# 画面が送る問い合わせ（frontend/graphql）の操作名と一致させる。queries は query の文書、mutations は mutation の文書の操作名で、
# spec/platform/metrics_subscriber_spec.rb が一致を確かめる
queries:
  - BuyerOrderForm
  - BuyerPurchaseOrder
  - BuyerPurchaseOrders
  - BuyerReceivedInvoice
  - BuyerReceivedInvoices
  - BuyerSupplierCatalog
  - BuyerSuppliers
  - SupplierBilling
  - SupplierDashboard
  - SupplierImport
  - SupplierImports
  - SupplierInvoice
  - SupplierInvoices
  - SupplierItem
  - SupplierItems
  - SupplierKanban
  - SupplierPartMappings
  - SupplierPartnerships
  - SupplierSalesOrder
  - SupplierSalesOrders
  - SupplierShipmentRequests
  - SupplierStockMovements
  - SupplierStocks
  - ViewerAuditLogs
  - ViewerLanding
  - ViewerSettings
  - ViewerShell
mutations:
  - AdjustStock
  - AllocateSalesOrder
  - ApproveCancellationReview
  - CancelSalesOrder
  - CancelShippingInstruction
  - CloseBillingPeriod
  - CorrectItemPrice
  - CreateShippingInstruction
  - DiscardDraftInvoice
  - EstablishPartnership
  - GrantPermission
  - InspectInboundShipment
  - IssueInvoice
  - PlacePurchaseOrder
  - PostShipment
  - RegisterPartMapping
  - RejectCancellationReview
  - RequestPurchaseOrderCancellation
  - RevokePartnership
  - SaveItem
  - ScheduleItemPrice
  - SetBillingTerm
  - SetItemPublished
  - StartImport
  - WithdrawPermission
