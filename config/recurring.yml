# 定期のジョブ（bin/jobs の scheduler が読む）。Webhook の受信の処理は、受信のときに登録したジョブを失っても
# 1 分ごとに拾い直す（docs/adr/007 決定 5 の A-3）
default: &default
  process_webhook_inbox:
    class: Notifications::ProcessInboxJob
    schedule: every minute
  purge_webhook_inbox:
    class: Notifications::PurgeInboxJob
    schedule: every day at 4am
  # 置いてから 24 時間を過ぎても取り込みを始めないファイルの中身を消す。1 時間ごとなら、消えるのは置いてから 25 時間までに収まる
  purge_abandoned_import_files:
    class: Imports::PurgeAbandonedFilesJob
    schedule: every hour

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
