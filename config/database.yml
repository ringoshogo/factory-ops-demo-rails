default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# 同じ DB に 2 つの設定を置く（docs/architecture/data-model.md「RLS」）。
# primary はアプリのロールで接続し、RLS の下で動く。DB のタスク（作成・マイグレーション・スキーマの読み込み）は
# 所有ロールの owner だけが行う。アプリのロールへの権限は lib/tasks/db_roles.rake がタスクの後に付与する。
app: &app
  database_tasks: false

owner: &owner
  migrations_paths: db/migrate
  schema_dump: structure.sql

# 開発とテストは compose.yaml の PostgreSQL 18 を使う。uuidv7() が 18 にしか無いため。
# ロールは docker/initdb/01_roles.sql が作る。
local_app: &local_app
  <<: [*default, *app]
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5433 } %>
  username: factory_app
  password: factory_app

local_owner: &local_owner
  <<: [*local_app, *owner]
  database_tasks: true
  username: factory_owner
  password: factory_owner

development:
  primary:
    <<: *local_app
    database: factory_ops_demo_rails_development
  owner:
    <<: *local_owner
    database: factory_ops_demo_rails_development

# TEST_DATABASE は、同じ test の環境を別の DB で動かすときに渡す。E2E は factory_ops_e2e を使い、rspec のテスト DB と分ける
# （lib/tasks/e2e.rake）。E2E の準備は DB を作り直すので、同じ DB を使うと rspec の DB を消す
test:
  primary:
    <<: *local_app
    database: <%= ENV.fetch("TEST_DATABASE", "factory_ops_demo_rails_test") %>
  owner:
    <<: *local_owner
    database: <%= ENV.fetch("TEST_DATABASE", "factory_ops_demo_rails_test") %>

# 本番の owner は、DB_OWNER_USER を渡したプロセスにだけ置く。所有ロールは BYPASSRLS を持つので、
# 資格情報はマイグレーションの工程にだけ渡し、Web とワーカーのプロセスには渡さない。
production:
  primary:
    <<: [*default, *app]
    database: factory_ops_demo_rails_production
    username: <%= ENV["DB_APP_USER"] %>
    password: <%= ENV["DB_APP_PASSWORD"] %>
<% if ENV["DB_OWNER_USER"].present? %>
  owner:
    <<: [*default, *owner]
    database: factory_ops_demo_rails_production
    username: <%= ENV["DB_OWNER_USER"] %>
    password: <%= ENV["DB_OWNER_PASSWORD"] %>
<% end %>
