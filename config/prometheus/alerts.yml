# 警報の規則（docs/slo.md）。SLO の値を変えたら、docs/slo.md と、ここの記録の規則と警報の閾値を同じ変更で直す。
# どの警報も annotations.runbook に手順書のパスを持つ（spec/platform/alerts_runbook_spec.rb）。
# bin/check-alerts が promtool で文法を確かめ、alerts_test.yml の系列で発火と不発火を確かめる。
#
# ヒストグラムの le は、Prometheus 3 が取り込みの時に浮動小数の表記にそろえる（le="1" は le="1.0" になる）ので、その表記で書く。
# 表記が違うと、バケットの系列が見つからずに割合が空になり、警報が黙って鳴らなくなる
groups:
  # SLO ごとの、窓の中で SLO を外れた要求の割合。警報は、この割合が誤差の予算（1 − SLO）の何倍の速さで減るかで鳴らす
  - name: slo-error-ratios
    rules:
      # 発注の登録の速さ（SLO 95%）：500 ms を超えた割合
      - record: slo:error_ratio:rate1h
        labels: { slo: place_purchase_order_latency }
        expr: |
          1 - sum(rate(graphql_operation_duration_seconds_bucket{operation="PlacePurchaseOrder",le="0.5"}[1h]))
            / sum(rate(graphql_operation_duration_seconds_count{operation="PlacePurchaseOrder"}[1h]))
      - record: slo:error_ratio:rate6h
        labels: { slo: place_purchase_order_latency }
        expr: |
          1 - sum(rate(graphql_operation_duration_seconds_bucket{operation="PlacePurchaseOrder",le="0.5"}[6h]))
            / sum(rate(graphql_operation_duration_seconds_count{operation="PlacePurchaseOrder"}[6h]))
      # 発注の登録の成功（SLO 99.5%）：outcome が error の割合。user_error は利用者の入力の誤りなので失敗に数えない
      - record: slo:error_ratio:rate1h
        labels: { slo: place_purchase_order_errors }
        expr: |
          sum(rate(graphql_operation_duration_seconds_count{operation="PlacePurchaseOrder",outcome="error"}[1h]))
            / sum(rate(graphql_operation_duration_seconds_count{operation="PlacePurchaseOrder"}[1h]))
      - record: slo:error_ratio:rate6h
        labels: { slo: place_purchase_order_errors }
        expr: |
          sum(rate(graphql_operation_duration_seconds_count{operation="PlacePurchaseOrder",outcome="error"}[6h]))
            / sum(rate(graphql_operation_duration_seconds_count{operation="PlacePurchaseOrder"}[6h]))
      # 画面の問い合わせの速さ（SLO 95%）：登録した query の操作が 1 秒を超えた割合。other は画面の外の問い合わせなので除く
      - record: slo:error_ratio:rate1h
        labels: { slo: screen_query_latency }
        expr: |
          1 - sum(rate(graphql_operation_duration_seconds_bucket{operation_type="query",operation!="other",le="1.0"}[1h]))
            / sum(rate(graphql_operation_duration_seconds_count{operation_type="query",operation!="other"}[1h]))
      - record: slo:error_ratio:rate6h
        labels: { slo: screen_query_latency }
        expr: |
          1 - sum(rate(graphql_operation_duration_seconds_bucket{operation_type="query",operation!="other",le="1.0"}[6h]))
            / sum(rate(graphql_operation_duration_seconds_count{operation_type="query",operation!="other"}[6h]))
      # イベントの配送の遅れ（SLO 99%）：発行から受け手の開始までが 60 秒を超えた割合
      - record: slo:error_ratio:rate1h
        labels: { slo: event_delivery_lag }
        expr: |
          1 - sum(rate(event_delivery_lag_seconds_bucket{le="60.0"}[1h])) / sum(rate(event_delivery_lag_seconds_count[1h]))
      - record: slo:error_ratio:rate6h
        labels: { slo: event_delivery_lag }
        expr: |
          1 - sum(rate(event_delivery_lag_seconds_bucket{le="60.0"}[6h])) / sum(rate(event_delivery_lag_seconds_count[6h]))
      # 確実な通知の受け付け（SLO 99%）：受領請求書の通知が、送信記録の作成から 15 分を超えて受け付けられた割合
      - record: slo:error_ratio:rate1h
        labels: { slo: received_invoice_acceptance }
        expr: |
          1 - sum(rate(notification_acceptance_seconds_bucket{kind="received_invoice",le="900.0"}[1h]))
            / sum(rate(notification_acceptance_seconds_count{kind="received_invoice"}[1h]))
      - record: slo:error_ratio:rate6h
        labels: { slo: received_invoice_acceptance }
        expr: |
          1 - sum(rate(notification_acceptance_seconds_bucket{kind="received_invoice",le="900.0"}[6h]))
            / sum(rate(notification_acceptance_seconds_count{kind="received_invoice"}[6h]))
      # 取り込みの完了（SLO 95%）：10,000 行以下の取り込みが、作ってから終えるまで 5 分を超えた割合
      - record: slo:error_ratio:rate1h
        labels: { slo: small_import_duration }
        expr: |
          1 - sum(rate(import_duration_seconds_bucket{size="small",le="300.0"}[1h])) / sum(rate(import_duration_seconds_count{size="small"}[1h]))
      - record: slo:error_ratio:rate6h
        labels: { slo: small_import_duration }
        expr: |
          1 - sum(rate(import_duration_seconds_bucket{size="small",le="300.0"}[6h])) / sum(rate(import_duration_seconds_count{size="small"}[6h]))

  # 誤差の予算の消費。1 時間で 28 日の予算の 2% を消費する速さ（13.44 倍）で呼び出し（page）、6 時間で 5% を消費する速さ（5.6 倍）で
  # チケット（ticket）にする。倍率は「消費する割合 × SLO の期間の時間数 ÷ 窓の時間数」で、28 日は 672 時間なので
  # 0.02 × 672 ÷ 1 = 13.44、0.05 × 672 ÷ 6 = 5.6 である。SLO の期間を変えたら倍率も直す。
  # 閾値は「倍率 × 誤差の予算（1 − SLO）」で書く。要求の無い窓は割合が空か NaN になり、鳴らない
  - name: slo-burn-rates
    rules:
      - alert: PlacePurchaseOrderLatencyBudgetBurnFast
        expr: slo:error_ratio:rate1h{slo="place_purchase_order_latency"} > 13.44 * 0.05
        labels: { severity: page }
        annotations:
          summary: 発注の登録が 500 ms を超える割合が、1 時間で 28 日の誤差の予算の 2% を消費する速さを超えた
          runbook: docs/runbooks/graphql-degradation.md
      - alert: PlacePurchaseOrderLatencyBudgetBurnSlow
        expr: slo:error_ratio:rate6h{slo="place_purchase_order_latency"} > 5.6 * 0.05
        labels: { severity: ticket }
        annotations:
          summary: 発注の登録が 500 ms を超える割合が、6 時間で 28 日の誤差の予算の 5% を消費する速さを超えた
          runbook: docs/runbooks/graphql-degradation.md
      - alert: PlacePurchaseOrderErrorBudgetBurnFast
        expr: slo:error_ratio:rate1h{slo="place_purchase_order_errors"} > 13.44 * 0.005
        labels: { severity: page }
        annotations:
          summary: 発注の登録の失敗の割合が、1 時間で 28 日の誤差の予算の 2% を消費する速さを超えた
          runbook: docs/runbooks/graphql-degradation.md
      - alert: PlacePurchaseOrderErrorBudgetBurnSlow
        expr: slo:error_ratio:rate6h{slo="place_purchase_order_errors"} > 5.6 * 0.005
        labels: { severity: ticket }
        annotations:
          summary: 発注の登録の失敗の割合が、6 時間で 28 日の誤差の予算の 5% を消費する速さを超えた
          runbook: docs/runbooks/graphql-degradation.md
      - alert: ScreenQueryLatencyBudgetBurnFast
        expr: slo:error_ratio:rate1h{slo="screen_query_latency"} > 13.44 * 0.05
        labels: { severity: page }
        annotations:
          summary: 画面の問い合わせが 1 秒を超える割合が、1 時間で 28 日の誤差の予算の 2% を消費する速さを超えた
          runbook: docs/runbooks/graphql-degradation.md
      - alert: ScreenQueryLatencyBudgetBurnSlow
        expr: slo:error_ratio:rate6h{slo="screen_query_latency"} > 5.6 * 0.05
        labels: { severity: ticket }
        annotations:
          summary: 画面の問い合わせが 1 秒を超える割合が、6 時間で 28 日の誤差の予算の 5% を消費する速さを超えた
          runbook: docs/runbooks/graphql-degradation.md
      - alert: EventDeliveryLagBudgetBurnFast
        expr: slo:error_ratio:rate1h{slo="event_delivery_lag"} > 13.44 * 0.01
        labels: { severity: page }
        annotations:
          summary: イベントの配送が 60 秒を超えて遅れる割合が、1 時間で 28 日の誤差の予算の 2% を消費する速さを超えた
          runbook: docs/runbooks/queue-backlog.md
      - alert: EventDeliveryLagBudgetBurnSlow
        expr: slo:error_ratio:rate6h{slo="event_delivery_lag"} > 5.6 * 0.01
        labels: { severity: ticket }
        annotations:
          summary: イベントの配送が 60 秒を超えて遅れる割合が、6 時間で 28 日の誤差の予算の 5% を消費する速さを超えた
          runbook: docs/runbooks/queue-backlog.md
      - alert: ReceivedInvoiceAcceptanceBudgetBurnFast
        expr: slo:error_ratio:rate1h{slo="received_invoice_acceptance"} > 13.44 * 0.01
        labels: { severity: page }
        annotations:
          summary: 受領請求書の通知の受け付けが 15 分を超える割合が、1 時間で 28 日の誤差の予算の 2% を消費する速さを超えた
          runbook: docs/runbooks/sendgrid-outage.md
      - alert: ReceivedInvoiceAcceptanceBudgetBurnSlow
        expr: slo:error_ratio:rate6h{slo="received_invoice_acceptance"} > 5.6 * 0.01
        labels: { severity: ticket }
        annotations:
          summary: 受領請求書の通知の受け付けが 15 分を超える割合が、6 時間で 28 日の誤差の予算の 5% を消費する速さを超えた
          runbook: docs/runbooks/sendgrid-outage.md
      - alert: SmallImportDurationBudgetBurnFast
        expr: slo:error_ratio:rate1h{slo="small_import_duration"} > 13.44 * 0.05
        labels: { severity: page }
        annotations:
          summary: 10,000 行以下の取り込みが 5 分を超える割合が、1 時間で 28 日の誤差の予算の 2% を消費する速さを超えた
          runbook: docs/runbooks/import-stuck.md
      - alert: SmallImportDurationBudgetBurnSlow
        expr: slo:error_ratio:rate6h{slo="small_import_duration"} > 5.6 * 0.05
        labels: { severity: ticket }
        annotations:
          summary: 10,000 行以下の取り込みが 5 分を超える割合が、6 時間で 28 日の誤差の予算の 5% を消費する速さを超えた
          runbook: docs/runbooks/import-stuck.md

  # 状態の警報。SLO の割合では遅れて見えるか、件数が少なくて割合にならない障害を、状態で捕まえる
  - name: states
    rules:
      # 失敗したジョブは、運用者がやり直すか捨てるまで failed のまま残る
      - alert: JobsFailed
        expr: sum by (queue) (queue_failed_jobs) > 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: 失敗したジョブが 10 分残っている
          runbook: docs/runbooks/queue-backlog.md
      - alert: EventsQueueBacklog
        expr: queue_ready_jobs{queue="events"} > 1000
        for: 5m
        labels: { severity: page }
        annotations:
          summary: イベントのキューの待ちが 5 分続けて 1,000 件を超えている
          runbook: docs/runbooks/queue-backlog.md
      # カウンタの「増えた」は、increase と、10 分前に無かった系列の 2 つで見る。カウンタの系列は最初に数えたときに現れるので、
      # プロセスの起動の後の最初の 1 件は increase に現れない
      - alert: ReceivedInvoiceNotificationFailed
        expr: |
          increase(notification_failures_total{kind="received_invoice"}[10m]) > 0
          or (notification_failures_total{kind="received_invoice"} unless notification_failures_total{kind="received_invoice"} offset 10m)
        labels: { severity: page }
        annotations:
          summary: 受領請求書の通知が、再試行しない応答か再試行を使い切って失敗した
          runbook: docs/runbooks/sendgrid-outage.md
      - alert: SendgridRateLimited
        expr: |
          sum by (provider) (rate(external_requests_total{status="429"}[5m])) / sum by (provider) (rate(external_requests_total[5m])) > 0.2
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: 外部の呼び出しの 429 の割合が 10 分続けて 20% を超えている
          runbook: docs/runbooks/sendgrid-outage.md
      # 返すオブジェクトとフィールドの規則の拒否（object）は scope と規則の食い違いで、テナントの境界の不具合の兆しである。
      # 宣言の無い拒否（undeclared）は、宣言を忘れた入口が本番に出た兆しである。member が admin に限る操作を呼んだ拒否（rule）は、
      # 画面がボタンを隠していても起こりうる利用者の操作なので、鳴らさない
      - alert: ForbiddenByObjectOrUndeclared
        expr: |
          increase(graphql_top_level_errors_total{code="FORBIDDEN",reason=~"object|undeclared"}[10m]) > 0
          or (
            graphql_top_level_errors_total{code="FORBIDDEN",reason=~"object|undeclared"}
            unless graphql_top_level_errors_total{code="FORBIDDEN",reason=~"object|undeclared"} offset 10m
          )
        labels: { severity: page }
        annotations:
          summary: 返すオブジェクトの規則か、宣言の無い入口が FORBIDDEN を返した
          runbook: docs/runbooks/rls-misconfiguration.md
      # 実行中のジョブがあるのに、反映した行が増えない。取り込みの行のカウンタだけでは、取り込みの無い時間と止まった取り込みを
      # 分けられないので、imports のキューの実行中のジョブと組み合わせる。どちらも 15 分の窓で見て、実行中が 15 分続き、
      # その間に行が増えないときに鳴らす。取り込みが一度も行を反映していないプロセスでは、行のカウンタの系列が無いので 0 と読む
      - alert: ImportStalled
        expr: |
          min_over_time(queue_claimed_jobs{queue="imports"}[15m]) > 0
          and on () (sum(increase(import_rows_total[15m])) or vector(0)) == 0
        labels: { severity: ticket }
        annotations:
          summary: 取り込みのジョブが 15 分実行中のまま、反映した行が増えない
          runbook: docs/runbooks/import-stuck.md
