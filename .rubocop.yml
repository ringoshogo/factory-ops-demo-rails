# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# frontend/ は Next の画面で、Ruby のファイルを持たない。node_modules の中のファイルを読ませないために外す。
# 継いだ設定の除外（omakase の data/）を消さないよう、Exclude は継いだものに足す
AllCops:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "frontend/**/*"

require:
  - ./lib/rubocop/cop/factory_ops/event_job_enqueue.rb
  - ./lib/rubocop/cop/factory_ops/external_effect_enqueue.rb
  - ./lib/rubocop/cop/factory_ops/no_history_comment.rb

# イベントのジョブの登録を Contracts.publish の 1 か所に限る（docs/adr/005）
FactoryOps/EventJobEnqueue:
  Enabled: true
  Exclude:
    - packs/contracts/app/public/contracts.rb

# 外部へ作用するジョブの登録を Notifications::Email の 1 か所に限る（docs/adr/007 決定 4）。
# Jobs は ExternalEffectJob のサブクラスの一覧で、spec/jobs/event_job_atomicity_spec.rb が実際のサブクラスと照らす
FactoryOps/ExternalEffectEnqueue:
  Enabled: true
  Jobs:
    - Notifications::CriticalDeliveryJob
    - Notifications::BestEffortMailJob
  # ジョブ自身の spec は、ジョブを作って流して確かめる
  Exclude:
    - packs/notifications/app/public/notifications/email.rb
    - packs/notifications/spec/**/*

# コメントに経緯・マイルストーンの番号・予定を書かせない（docs/guides/comments.md「機械で止めるもの」）
FactoryOps/NoHistoryComment:
  Enabled: true

# 業務の今日をアプリの時刻帯（config.time_zone）の Date.current・Time.current で決め、システムの時刻帯で決まる
# Date.today・Time.now・Time.parse などを混ぜない（docs/guides/config.md「application.rb で変えたこと」）
Rails/Date:
  Enabled: true

Rails/TimeZone:
  Enabled: true
