# 毎日の作り直し（docs/adr/009 決定 3、lib/demo_reset.rb）。web と jobs を 0 にしてから DB ごと作り直し、シードの世界を作って 1 に戻す
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daily-reset
---
# 作り直しが Kubernetes の API で行うことだけを許す。web と jobs の数を変え、Pod が無くなったかを見る
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: daily-reset
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["web", "jobs"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["web", "jobs"]
    verbs: ["get", "patch"]
  # 一覧はラベルで絞り、名前では絞れない
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: daily-reset
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: daily-reset
subjects:
  - kind: ServiceAccount
    name: daily-reset
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-reset
  labels:
    app: daily-reset
spec:
  # 作者が決める時刻（deploy/README.md「作者が決める値」）。流用元の毎日のリセット（4:00）と重ねず、利用の少ない時間に置く。
  # 作り直しの数分は、画面が「API に届かない」の表示になる
  schedule: "30 4 * * *"
  timeZone: Asia/Tokyo # 書かないと UTC で読み、日本時間の 13:30 に流れる
  concurrencyPolicy: Forbid # 前の作り直しが終わる前に、次の作り直しが DB を消さない
  # Raspberry Pi を止めている間に時刻を過ぎても、時刻から 6 時間の内に起動すれば、起動の後に流す
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 途中で失敗した作り直しを繰り返して、DB を何度も消さない。失敗した日は次の日の作り直しに任せる
      backoffLimit: 0
      # Pod の待ち（上限 5 分）とシードを足しても余る長さ。超えたら SIGTERM で止め、web と jobs を 1 に戻させる
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: daily-reset
        spec:
          # 止められたとき（activeDeadlineSeconds を過ぎたときと、Job を消したとき）、SIGTERM の後に web と jobs を 1 に戻す 2 つの要求が
          # 終わるだけの猶予を置く。要求の時間切れは lib/demo_reset/kubernetes.rb にある
          terminationGracePeriodSeconds: 90
          serviceAccountName: daily-reset
          automountServiceAccountToken: true
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
          containers:
            - name: daily-reset
              image: ghcr.io/ringoshogo/factory-ops-demo-rails/api
              args: ["bin/rails", "demo:reset"]
              env:
                - name: RAILS_ENV
                  value: production
                - name: SECRET_KEY_BASE
                  valueFrom:
                    secretKeyRef:
                      name: rails-credentials
                      key: secret-key-base
                - name: DB_HOST
                  value: postgres
                - name: DB_PORT
                  value: "5432"
                # db:grant_app_role とシードが、アプリのロールの名前を読む
                - name: DB_APP_USER
                  value: factory_app
                - name: DB_APP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: app-password
                # 所有ロールで DB を消して作り直す（config/database.yml）
                - name: DB_OWNER_USER
                  value: factory_owner
                - name: DB_OWNER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: owner-password
                # シードがその場で流すジョブがメールを書く
                - name: NOTIFICATIONS_PROVIDER
                  value: file_system
                # 本番の環境でデモの世界を作ってよいのは、このコンテナだけである（docs/adr/009 決定 4）
                - name: DEMO_WORLD_ENABLED
                  value: "1"
              # 見積もりで、実機で測っていない（deploy/README.md「作者の手順」4）。Rails を読み込み、シードの間にイベントのジョブを
              # その場で流す。毎日の数分だけ動き、その間は web と jobs が止まっている
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 768Mi
              volumeMounts:
                - name: mails
                  mountPath: /rails/tmp/mails
          volumes:
            - name: mails
              emptyDir:
                sizeLimit: 256Mi
