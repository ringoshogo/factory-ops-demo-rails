type Query {
  order(id: ID!, includeDrafts: Boolean @deprecated(reason: "常に下書きを含む")): Order
  orders(status: OrderStatus, filter: OrderFilter, first: Int! = 20): [Order!]!
  legacyOrder(id: ID!): LegacyOrder @deprecated(reason: "order を使う")
  legacySearch(filter: LegacyFilter): [Order!]! @deprecated(reason: "orders を使う")
  search(keyword: String!): [SearchHit!]!
  documents: [Document!]!
}

type Mutation {
  placeOrder(input: PlaceOrderInput!): Order
}

type Order {
  id: ID!
  code: String!
  note: String
  memo: String @deprecated(reason: "note を使う")
  amount: Int!
  legacyAmount: Int @deprecated(reason: "amount を使う")
  shipment: Shipment
  legacyShipment: Shipment @deprecated(reason: "shipment を使う")
  stage: OrderStage!
}

type LegacyOrder {
  id: ID!
}

type Shipment {
  id: ID!
}

type Notice {
  id: ID!
}

union SearchHit = Order | Notice

interface Document {
  id: ID!
}

type Invoice implements Document {
  id: ID!
}

"""
引数で受け取る enum
"""
enum OrderStatus {
  OPEN
  CLOSED
  ARCHIVED @deprecated(reason: "CLOSED を使う")
}

"""
出力にだけ使う enum
"""
enum OrderStage {
  DRAFT
  PLACED
  SHIPPED
  LOST @deprecated(reason: "使わない")
}

input PlaceOrderInput {
  code: String!
  priority: Int @deprecated(reason: "使わない")
  quantity: Int! = 1
  price: Money
}

input Money {
  amount: Int!
}

input OrderFilter {
  code: String
}

input LegacyFilter {
  code: String
}
