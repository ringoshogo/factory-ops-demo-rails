query SupplierPartMappings($first: Int, $after: String, $customerTenantId: ID) {
  supplier {
    partMappings(first: $first, after: $after, customerTenantId: $customerTenantId) {
      nodes {
        id
        customerPartNumber
        customer { id name }
        item { id code name }
      }
      pageInfo { hasNextPage endCursor }
    }
  }
}
