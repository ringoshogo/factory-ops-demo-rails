query SupplierSalesOrders($first: Int, $after: String, $orderBy: SalesOrderOrder, $filter: SalesOrderFilter) {
  supplier {
    salesOrders(first: $first, after: $after, orderBy: $orderBy, filter: $filter) {
      totalCount
      nodes {
        id
        orderNo
        orderDate
        dueDate
        status
        customer { id name }
        lines { id customerPartNumber itemName quantity allocatedQuantity unitPrice taxRatePercent }
        shipmentRequest { id status }
      }
      pageInfo { hasNextPage endCursor }
    }
  }
}
