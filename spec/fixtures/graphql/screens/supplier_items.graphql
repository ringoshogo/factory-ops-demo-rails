query SupplierItems($first: Int, $after: String, $orderBy: ItemOrder, $filter: ItemFilter) {
  supplier {
    items(first: $first, after: $after, orderBy: $orderBy, filter: $filter) {
      totalCount
      nodes {
        id
        code
        name
        unit
        unitPrice
        taxRatePercent
        published
        stock { onHand allocated available safetyStock belowSafetyStock }
      }
      pageInfo { hasNextPage endCursor }
    }
  }
}
